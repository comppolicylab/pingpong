[project]
name = "pingpong"
version = "7.87.1"
description = "A software platform carefully designed for AI-driven learning."
readme = "README.md"
requires-python = ">= 3.11, <4.0.0"
authors = [
    { name = "Joe Nudell", email = "jnudell@hks.harvard.edu" },
    { name = "Evangelos Kassos", email = "github@evangeloskassos.com" }
]
license = "MIT"
dependencies = [
    "aioboto3 ~= 15.5.0",
    "aiohttp~=3.14.3",
    "aiosmtplib~=5.1.3",
    "aiosqlite ~= 0.22.1",
    "alembic~=1.20.0",
    "arrow ~= 1.4.0",
    "asyncpg ~= 0.31.0",
    "audioop-lts ~= 0.2.2 ; python_full_version >= '3.13'",
    "authlib~=1.8.0",
    "azure-communication-email ~= 1.1.0",
    "beautifulsoup4~=4.15.0",
    "cryptography~=50.0.2",
    "discord-py~=2.7.1",
    "elevenlabs~=2.70.0",
    "email-validator ~= 2.3.0",
    "fastapi[standard]~=0.141.1",
    "google-genai [aiohttp] ~= 1.67.0",
    "httpx ~= 0.28.1",
    "humanize~=4.16.0",
    "mmh3~=5.3.1",
    "openai[realtime]~=3.19.2",
    "openfga-sdk~=0.10.5",
    "opentelemetry-sdk~=1.45.0",
    "orjson~=3.12.0",
    "psycopg2-binary~=2.9.13",
    "pybase64~=1.5.1",
    "pydantic~=2.13.5",
    "pydantic-settings~=2.15.0",
    "pydub ~= 0.25.1",
    "pyjwt~=2.15.1",
    "pypdf~=6.19.0",
    "python-glowplug~=0.3.13",
    "python3-saml ~= 1.16.0",
    "pytz~=2026.4",
    "redis~=8.1.0",
    "requests~=2.34.2",
    "sentry-sdk~=2.71.0",
    "sqlalchemy [asyncio] ~= 2.0.46",
    "starlette~=1.7.0",
    "tiktoken~=0.14.0",
    "tqdm~=4.70.1",
    "uuid-utils~=1.0.0",
    "uvicorn~=0.54.0",
]

[project.urls]
Homepage = "https://pingpong.hks.harvard.edu/"
Repository = "https://github.com/comppolicylab/pingpong.git"
Issues = "https://github.com/comppolicylab/pingpong/issues"
ReleaseNotes = "https://github.com/comppolicylab/pingpong/releases"

[dependency-groups]
dev = [
    "locust~=2.46.6",
    "pre-commit~=4.6.2",
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    "pytest-xdist~=3.8.0",
]

[tool.uv]
override-dependencies = ["pygments >= 2.20.0", "mako >= 1.3.12"]
